baseURL = '/'
languageCode = 'zh-CN, en-US'
defaultContentLanguage = 'en'
title = 'ThermalPro - Advanced Thermal Management Solutions'
theme = 'hugo-serif-theme'

[params]
  description = 'Professional thermal management solutions for industrial applications'
  author = 'ThermalPro'
  email = 'info@thermalpro.com'
  phone = '+86-XXX-XXXX-XXXX'
  address = 'Shenzhen, China'
  copyright = '© 2025 ThermalPro. All rights reserved.'

[params.homepage]
  show_contact_box = true
  show_services_button = true

[params.fonts]
  google_fonts = 'https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Source+Sans+Pro:wght@400;700&display=swap'
  heading = 'Playfair Display'
  base = 'Source Sans Pro'

[params.colors]
  primary = '#f24088'
  black = '#2f2f41'
  white = '#ffffff'
  white_offset = '#f6f7ff'
  grey = '#5C5A5A'

[params.social]
  linkedin = '#'
  facebook = '#'
  twitter = '#'

[menu]
  [[menu.main]]
    identifier = 'home'
    name = 'Home'
    url = '/'
    weight = 1
  [[menu.main]]
    identifier = 'products'
    name = 'Products'
    url = '/products/'
    weight = 2
  [[menu.main]]
    identifier = 'services'
    name = 'Custom Services'
    url = '/services/'
    weight = 3
  [[menu.main]]
    identifier = 'applications'
    name = 'Applications'
    url = '/applications/'
    weight = 4
  [[menu.main]]
    identifier = 'about'
    name = 'About Us'
    url = '/about/'
    weight = 5
  [[menu.main]]
    identifier = 'contact'
    name = 'Contact'
    url = '/contact/'
    weight = 6

[languages]
  [languages.en]
    languageName = 'English'
    contentDir = 'content/en'
    weight = 1
  [languages.zh]
    languageName = '中文'
    contentDir = 'content/zh'
    weight = 2
